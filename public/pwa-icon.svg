<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded corners for Android maskable / icon -->
  <rect width="512" height="512" rx="112" fill="url(#pwaGrad)" />
  
  <!-- Subtle inner glow -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Shield Shape / Hospital Emblem -->
  <g filter="url(#shadow)">
    <!-- Hospital Cross Core -->
    <path d="M216 128 H296 V216 H384 V296 H296 V384 H216 V296 H128 V216 H216 Z" fill="#ffffff" />
    <!-- Center Caduceus / Pill accent -->
    <circle cx="256" cy="256" r="32" fill="#0d9488" />
    <path d="M244 244 L268 268 M244 268 L268 244" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>
  
  <!-- Bottom Hospital Badge Text -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="4">PHARMAGARDE</text>
</svg>
